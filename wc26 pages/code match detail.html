 const seedFromString = (value) => {
  let seed = 0;
  for (let index = 0; index < value.length; index += 1) seed = (seed * 31 + value.charCodeAt(index)) >>> 0;
  return seed || 1;
 };
 const randomFactory = (seedValue) => {

   seed = (seed * 1664525 + 1013904223) >>> 0;
   return seed / 4294967296;
  };
 };

 };
 const formatDateForUi = (value) => {
  if (!value) return '';
  const dt = new Date(value);
  if (Number.isNaN(dt.getTime())) return String(value).replace('T', ' ').slice(0, 16);
  const yyyy = dt.getUTCFullYear();
  const mm = String(dt.getUTCMonth() + 1).padStart(2, '0');
  const dd = String(dt.getUTCDate()).padStart(2, '0');
  const hh = String(dt.getUTCHours()).padStart(2, '0');
  const mi = String(dt.getUTCMinutes()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd} ${hh}:${mi}`;
 };

 const buildLineup = (teamName, side, goalsFor, goalsAgainst) => {
  const lineupSeed = seedFromString(`${teamName}-${side}-${matchSeed}`);
  const lineupRnd = randomFactory(lineupSeed ^ (side === 'home' ? 0x51ed : 0xbada));
  const template = lineupTemplates[side];
  const code = teamCode(teamName);
  const bias = goalsFor > goalsAgainst ? 0.8 : goalsFor === goalsAgainst ? 0.25 : -0.15;

  return template.map((slot, index) => {
   const base = slot.position === 'GK' ? 6.4 : slot.position === 'ST' ? 7.4 : slot.position === 'AM' ? 7.1 : 6.8;
   const passes = Math.round(clamp((slot.position === 'GK' ? 18 : slot.position === 'ST' ? 22 : 34) + lineupRnd() * 42 + index * 2, 8, 96));
   const shots = Math.round(clamp((slot.position === 'ST' || slot.position === 'AM' ? 1 : 0) + lineupRnd() * 3, 0, 7));
   const goals = slot.position === 'ST' ? clamp(Math.round(lineupRnd() * Math.max(1, goalsFor)), 0, 3) : 0;
   const assists = slot.position === 'AM' || slot.position === 'RW' || slot.position === 'LW' ? clamp(Math.round(lineupRnd() * 2 + bias), 0, 3) : clamp(Math.round(lineupRnd() * 1.2), 0, 2);
   const rating = Number(clamp(base + lineupRnd() * 1.8 + bias * 0.6, 5.5, 9.9).toFixed(1));
   return {
    side,
    player: {
     id: `${slugify(teamName)}-${slot.position.toLowerCase()}-${index}`,
      name: rosterNameForSlot(teamName, slot, index),
     number: 1 + index,
     position: slot.position,
     x: slot.x,
     y: slot.y,
     stats: { goals, assists, passes, shots, minutes: slot.position === 'GK' ? 90 : 84 - index, fouls: clamp(Math.round(lineupRnd() * 3), 0, 4), cards: clamp(Math.round(lineupRnd() * 2), 0, 2), rating }
    }
   };
  });
 };

 const buildTimeline = (fixture) => {
  const events = [];
  const goalSources = [];
  const homeScorers = fixture.homeLineup.filter(({ player }) => player.position === 'ST' || player.position === 'AM');
  const awayScorers = fixture.awayLineup.filter(({ player }) => player.position === 'ST' || player.position === 'AM');

  for (let i = 0; i < fixture.homeScore; i += 1) goalSources.push({ team: fixture.homeTeam, player: homeScorers[i % Math.max(1, homeScorers.length)]?.player });
  for (let i = 0; i < fixture.awayScore; i += 1) goalSources.push({ team: fixture.awayTeam, player: awayScorers[i % Math.max(1, awayScorers.length)]?.player });

  goalSources.forEach((source, index) => {
   const minute = Math.round(clamp(8 + (index + 1) * 12 + (matchSeed % 7), 5, 90));
   events.push({ minute, type: 'GOAL', team: source.team.code, playerId: source.player?.id || null, playerName: source.player?.name || `${source.team.code} finisher`, description: `${source.team.name} found space in the final third and converted the chance.`, focusPlayer: source.player ? { playerId: source.player.id, playerName: source.player.name, teamCode: source.team.code } : null });
  });

  if (!events.length) {
   events.push({ minute: 1, type: 'INFO', team: fixture.homeTeam.code, description: 'No discrete events were captured for this fixture.', focusPlayer: null });
  }

  return events.sort((left, right) => left.minute - right.minute);
 };

 const PLAYER_APPEARANCES_FEED = 'https://raw.githubusercontent.com/jfjelstul/worldcup/master/data-csv/player_appearances.csv';
 let playerAppearancesPromise = null;

 const parseCsv = (text) => {
  const rows = [];
  const lines = String(text || '').trim().split(/\r?\n/);
  if (!lines.length) return rows;

  const splitCsvLine = (line) => {
   const values = [];
   let current = '';
   let insideQuotes = false;

   for (let index = 0; index < line.length; index += 1) {
    const character = line[index];
    if (character === '"') {
     if (insideQuotes && line[index + 1] === '"') {
      current += '"';
      index += 1;
     } else {
      insideQuotes = !insideQuotes;
     }
     continue;
    }

    if (character === ',' && !insideQuotes) {
     values.push(current);
     current = '';
     continue;
    }

    current += character;
   }

   values.push(current);
   return values;
  };

  const headers = splitCsvLine(lines[0]).map((value) => value.trim());
  for (let index = 1; index < lines.length; index += 1) {
   const line = lines[index].trim();
   if (!line) continue;
   const values = splitCsvLine(line);
   const row = {};
   headers.forEach((header, headerIndex) => {
    row[header] = (values[headerIndex] ?? '').trim();
   });
   rows.push(row);
  }

  return rows;
 };

 const loadWorldCupAppearances = async () => {
  if (!playerAppearancesPromise) {
   playerAppearancesPromise = fetch(PLAYER_APPEARANCES_FEED)
    .then((response) => {
     if (!response.ok) throw new Error(`Player appearances feed failed: ${response.status}`);
     return response.text();
    })
    .then(parseCsv)
    .catch((error) => {
     console.error('Unable to load World Cup appearances data.', error);
     return [];
    });
  }

  return playerAppearancesPromise;
 };

const generateTemplateFromFormation = (formation, side) => {
 const parts = String(formation || '').split('-').map((p) => parseInt(p, 10) || 0).filter((n) => n > 0);
 const isHome = side === 'home';
 const xFor = (band, rowIndex = 0, totalRows = 1) => {
  // map defensive/mid/att rows to approximate x positions depending on side and row
  const homeMap = { def: 20, mid: 45, att: 68 };
  const awayMap = { def: 80, mid: 57, att: 32 };
  return isHome ? homeMap[band] : awayMap[band];
 };

 const distributeYs = (count) => {
  const spanStart = 18;
  const spanEnd = 82;
  if (count <= 1) return [50];
  const step = (spanEnd - spanStart) / (count - 1);
  return Array.from({ length: count }).map((_, i) => Math.round(spanStart + i * step));
 };

 const slots = [{ position: 'GK', x: isHome ? 8 : 92, y: 50 }];

 // Determine rows: support 3-part and 4-part formations
 const defCount = parts[0] || 4;
 const hasFourParts = parts.length >= 4;
 const midDeepCount = hasFourParts ? (parts[1] || 0) : (parts[1] || 0);
 const midAdvanceCount = hasFourParts ? (parts[2] || 0) : 0;
 const attCount = hasFourParts ? (parts[3] || (parts[2] || 1)) : (parts[2] || 1);

 const addRow = (count, band, positionChooser) => {
  const ys = distributeYs(count);
  for (let i = 0; i < count; i += 1) {
   const pos = positionChooser ? positionChooser(i, count) : 'CM';
   slots.push({ position: pos, x: xFor(band), y: ys[i] });
  }
 };

 // defenders
 addRow(defCount, 'def', (i, count) => (count === 3 ? (i === 0 ? 'LCB' : i === 1 ? 'CB' : 'RCB') : (i === 0 ? 'LB' : i === count - 1 ? 'RB' : 'CB')));

 // mid-deep row (if present)
 if (midDeepCount > 0) {
  addRow(midDeepCount, 'mid', (i, count) => (count === 1 ? 'CM' : i === 0 ? 'DM' : i === count - 1 ? 'DM' : 'CM'));
 }

 // mid-advanced row (for 4-part formations)
 if (midAdvanceCount > 0) {
  addRow(midAdvanceCount, 'mid', (i, count) => (count === 1 ? 'AM' : i === 0 ? 'LM' : i === count - 1 ? 'RM' : 'CM'));
 }

 // attackers row
 if (attCount > 0) {
  addRow(attCount, 'att', (i, count) => {
   if (count === 1) return 'ST';
   if (count === 2) return i === 0 ? 'ST' : 'ST';
   if (count === 3) return i === 0 ? 'LW' : i === 1 ? 'ST' : 'RW';
   return 'ST';
  });
 }

 // ensure exactly 11 players (GK + 10 outfield)
 if (slots.length > 11) slots.splice(11);
 while (slots.length < 11) slots.push({ position: 'CM', x: xFor('mid'), y: 50 });
 return slots;
};

 const buildAppearanceStats = (row, slot, index, side, goalsFor, goalsAgainst) => {
  const playerSeed = seedFromString(`${row?.player_id || row?.family_name || row?.given_name || slot.position}-${side}-${index}-${matchSeed}`);
  const playerRnd = randomFactory(playerSeed);
  const base = slot.position === 'GK' ? 6.6 : slot.position === 'ST' ? 7.2 : slot.position === 'AM' ? 7.0 : 6.7;
  const bias = goalsFor > goalsAgainst ? 0.4 : goalsFor === goalsAgainst ? 0.15 : -0.2;

  return {
   goals: 0,
   assists: clamp(Math.round(playerRnd() * 2 + (slot.position === 'AM' || slot.position === 'LW' || slot.position === 'RW' ? 1 : 0) + bias), 0, 3),
   passes: Math.round(clamp((slot.position === 'GK' ? 18 : slot.position === 'ST' ? 20 : 32) + playerRnd() * 38 + index * 2, 8, 96)),
   shots: Math.round(clamp((slot.position === 'ST' || slot.position === 'AM' ? 1 : 0) + playerRnd() * 3, 0, 7)),
   minutes: 90,
   fouls: clamp(Math.round(playerRnd() * 3), 0, 4),
   cards: clamp(Math.round(playerRnd() * 2), 0, 2),
   rating: Number(clamp(base + playerRnd() * 1.4 + bias, 5.5, 9.9).toFixed(1))
  };
 };

 const buildAppearanceLineup = (teamName, side, goalsFor, goalsAgainst, starterRows) => {
  const starters = starterRows
   .filter((row) => String(row?.starter) === '1')
   .slice()
   .sort((left, right) => {
    const shirtDiff = parseNumber(left?.shirt_number, 0) - parseNumber(right?.shirt_number, 0);
    if (shirtDiff !== 0) return shirtDiff;
    return appearanceDisplayName(left).localeCompare(appearanceDisplayName(right));
   });

  const pools = {
   GK: starters.filter((row) => appearanceRole(row) === 'GK'),
   DEF: starters.filter((row) => appearanceRole(row) === 'DEF'),
   MID: starters.filter((row) => appearanceRole(row) === 'MID'),
   FWD: starters.filter((row) => appearanceRole(row) === 'FWD')
  };
  const fallbackOrder = ['GK', 'DEF', 'MID', 'FWD'];

  const takePlayer = (preferredPool) => {
   const orderedPools = [preferredPool, ...fallbackOrder.filter((poolName) => poolName !== preferredPool)];
   for (const poolName of orderedPools) {
    if (pools[poolName]?.length) return pools[poolName].shift();
   }
   return starters.shift() || null;
  };

  return lineupTemplates[side].map((slot, index) => {
   const preferredPool = slot.position === 'GK' ? 'GK' : (slot.position === 'ST' || slot.position === 'LW' || slot.position === 'RW') ? 'FWD' : (slot.position === 'DM' || slot.position === 'CM' || slot.position === 'AM') ? 'MID' : 'DEF';
   const row = takePlayer(preferredPool);
   const playerName = row ? appearanceDisplayName(row) : rosterNameForSlot(teamName, slot, index);
   const playerNumber = parseNumber(row?.shirt_number, index + 1);
   const positionCode = String(row?.position_code || slot.position).toUpperCase();
   return {
    side,
    player: {
     id: row?.player_id || `${slugify(teamName)}-${slot.position.toLowerCase()}-${index}`,
     name: playerName,
     number: playerNumber,
     position: positionCode,
     x: slot.x,
     y: slot.y,
     stats: buildAppearanceStats(row, slot, index, side, goalsFor, goalsAgainst)
    }
   };
  });
 };

 const hydrateWorldCupLineups = (fixtureRows) => {
  const fixtureKey = normalizeLookupKey(`${match.homeTeam.name} vs ${match.awayTeam.name}`);
  const fixtureDate = String(match.date || '').slice(0, 10);
  const matchingRows = fixtureRows.filter((row) => {
   if (String(row?.tournament_id) !== 'WC-2022') return false;
   if (normalizeLookupKey(row?.match_name) !== fixtureKey) return false;
   return String(row?.match_date || '').slice(0, 10) === fixtureDate;
  });

  if (!matchingRows.length) {
   match.hasLineupData = false;
   match.lineupSource = null;
   match.homeLineup = [];
   match.awayLineup = [];
   return false;
  }

  const homeRows = matchingRows.filter((row) => normalizeLookupKey(row?.team_name) === normalizeLookupKey(match.homeTeam.name));
  const awayRows = matchingRows.filter((row) => normalizeLookupKey(row?.team_name) === normalizeLookupKey(match.awayTeam.name));

  if (!homeRows.length || !awayRows.length) {
   match.hasLineupData = false;
   match.lineupSource = null;
   match.homeLineup = [];
   match.awayLineup = [];
   return false;
  }

  match.homeLineup = buildAppearanceLineup(match.homeTeam.name, 'home', match.homeScore, match.awayScore, homeRows);
  match.awayLineup = buildAppearanceLineup(match.awayTeam.name, 'away', match.awayScore, match.homeScore, awayRows);
  match.hasLineupData = true;
  match.lineupSource = 'appearance-feed';
  return true;
 };

 const normalizeLineupEntries = (rawLineup) => {
  if (Array.isArray(rawLineup)) return rawLineup;
  if (Array.isArray(rawLineup?.startXI)) return rawLineup.startXI;
  if (Array.isArray(rawLineup?.startingXI)) return rawLineup.startingXI;
  return [];
 };

 const readApiLineup = (fixture, side) => {
  const direct = fixture?.[`${side}Lineup`] || fixture?.[`${side}Team`]?.lineup || fixture?.lineups?.[side];
  const normalized = normalizeLineupEntries(direct);
  if (normalized.length) return normalized;
  if (!Array.isArray(fixture?.lineups)) return [];

  const teamName = side === 'home'
   ? (fixture?.homeTeam?.name || fixture?.homeTeam?.shortName || '').toLowerCase()
   : (fixture?.awayTeam?.name || fixture?.awayTeam?.shortName || '').toLowerCase();
  const matchLineup = fixture.lineups.find((entry) => String(entry?.team?.name || '').toLowerCase() === teamName) || null;
  if (!matchLineup) return [];
  return normalizeLineupEntries(matchLineup);
 };

 const mergeApiLineup = (teamName, side, goalsFor, goalsAgainst, apiEntries) => {
  const generated = buildLineup(teamName, side, goalsFor, goalsAgainst);
  if (!apiEntries.length) return generated;

  return generated.map((entry, index) => {
   const source = apiEntries[index] || {};
   const sourcePlayer = source.player || source;
   const name = sourcePlayer?.name || sourcePlayer?.player_name || sourcePlayer?.fullName || entry.player.name;
   const number = parseNumber(sourcePlayer?.number ?? sourcePlayer?.shirtNumber, entry.player.number);
   const pos = String(sourcePlayer?.pos || sourcePlayer?.position || entry.player.position).toUpperCase();
   const minutes = parseNumber(sourcePlayer?.minutes, entry.player.stats.minutes);
   const passes = parseNumber(sourcePlayer?.passes ?? sourcePlayer?.statistics?.passes?.total, entry.player.stats.passes);
   const rating = Number(parseNumber(sourcePlayer?.rating ?? sourcePlayer?.statistics?.games?.rating, entry.player.stats.rating).toFixed(1));
   return {
    ...entry,
    player: {
     ...entry.player,
     name,
     number,
     position: pos,
     stats: {
      ...entry.player.stats,
      minutes,
      passes,
      rating
     }
    }
   };
  });
 };

 const rebuildDerivedData = () => {
  match.stats = {
   possession: [clamp(Math.round(52 + (match.homeScore - match.awayScore) * 4 + (matchSeed % 7) - 3), 38, 64), 0],
   totalGoals: match.homeScore + match.awayScore,
   winProbability: clamp(Math.round(50 + (match.homeScore - match.awayScore) * 12 + (matchSeed % 13) - 6), 15, 96)
  };
  match.stats.possession[1] = 100 - match.stats.possession[0];
  match.events = buildTimeline(match);
 };

 const applyApiFixture = (fixture) => {
  if (!fixture) return;

  const apiHome = fixture?.homeTeam?.shortName || fixture?.homeTeam?.name || match.homeTeam.name;
  const apiAway = fixture?.awayTeam?.shortName || fixture?.awayTeam?.name || match.awayTeam.name;
  const apiStage = normalizeStage(String(fixture?.group || fixture?.stage || match.stage));
  const apiScore = fixture?.score?.fullTime || {};
  const apiStatusMap = {
   FINISHED: 'FINISHED',
   IN_PLAY: 'LIVE',
   PAUSED: 'LIVE',
   TIMED: 'SCHEDULED',
   SCHEDULED: 'SCHEDULED'
  };

  match.id = String(fixture.id || match.id);
  match.stage = apiStage;
  match.date = formatDateForUi(fixture?.utcDate || match.date);
  match.venue = fixture?.venue || venueMap[apiStage] || match.venue;
  match.status = apiStatusMap[String(fixture?.status || '').toUpperCase()] || match.status;
  match.homeScore = parseNumber(apiScore.home, match.homeScore);
  match.awayScore = parseNumber(apiScore.away, match.awayScore);
  match.homeTeam = { ...match.homeTeam, name: apiHome, code: teamCode(apiHome), manager: `${apiHome} Manager` };
  match.awayTeam = { ...match.awayTeam, name: apiAway, code: teamCode(apiAway), manager: `${apiAway} Manager` };

  const homeApiLineup = readApiLineup(fixture, 'home');
  const awayApiLineup = readApiLineup(fixture, 'away');
  if (homeApiLineup.length && awayApiLineup.length) {
   match.hasLineupData = true;
   match.homeLineup = mergeApiLineup(match.homeTeam.name, 'home', match.homeScore, match.awayScore, homeApiLineup);
   match.awayLineup = mergeApiLineup(match.awayTeam.name, 'away', match.awayScore, match.homeScore, awayApiLineup);
  }
 };

   const applyWorldCupFixture = (fixture) => {
    if (!fixture) return;

    match.id = worldCupMatchId(fixture);
    match.stage = normalizeStage(String(fixture?.round || fixture?.group || match.stage));
    match.date = formatDateForUi(`${fixture?.date || ''}T${fixture?.time || '00:00'}:00Z`);
    match.venue = fixture?.ground || match.venue;
    match.status = 'FINISHED';
    match.homeScore = parseNumber(fixture?.score?.ft?.[0], match.homeScore);
    match.awayScore = parseNumber(fixture?.score?.ft?.[1], match.awayScore);
    match.homeTeam = { ...match.homeTeam, name: fixture?.team1 || match.homeTeam.name, code: teamCode(fixture?.team1 || match.homeTeam.name), manager: `${fixture?.team1 || match.homeTeam.name} Manager` };
    match.awayTeam = { ...match.awayTeam, name: fixture?.team2 || match.awayTeam.name, code: teamCode(fixture?.team2 || match.awayTeam.name), manager: `${fixture?.team2 || match.awayTeam.name} Manager` };
    match.hasLineupData = false;
    match.lineupSource = null;
    match.homeLineup = [];
    match.awayLineup = [];
   };

   const fetchWorldCupFixture = async (matchId) => {
    const response = await fetch(WORLD_CUP_FEED);
    if (!response.ok) throw new Error(`World Cup feed failed: ${response.status}`);
    const payload = await response.json();
    const matches = Array.isArray(payload?.matches) ? payload.matches : [];
    const normalizedId = slugify(String(matchId || ''));
    return matches.find((fixture) => worldCupMatchId(fixture) === normalizedId) || null;
   };

 const allPlayers = () => match.homeLineup.concat(match.awayLineup);
 const playerShell = document.getElementById('selected-player-shell');
 const pitch = document.getElementById('match-pitch');
 const meridian = window.WC26Meridian;
 const zoomLevels = ['overview', 'tactical', 'forensic'];
 let viewState = meridian ? meridian.currentView() : { zoom: 'tactical', layers: { drawer: true, pitchSummary: true, playerChips: true, playerNames: true, scoreBanner: true } };
 const layerPanel = document.getElementById('meridian-layer-panel');
 const panelToggle = document.getElementById('meridian-panel-toggle');
 const panelClose = document.getElementById('meridian-close-panel');
 const zoomButton = document.getElementById('meridian-zoom-button');
 const saveButton = document.getElementById('meridian-save-button');

 const applyViewState = (nextView = viewState) => {
  viewState = nextView;
  if (meridian) meridian.applyView(document.body, viewState);
  if (layerPanel) {
   layerPanel.querySelectorAll('input[data-layer-toggle]').forEach((input) => {
    const layerName = input.getAttribute('data-layer-toggle');
    input.checked = viewState.layers[layerName] !== false;
   });
  }
  if (zoomButton) {
   zoomButton.textContent = viewState.zoom === 'overview' ? 'zoom_out' : viewState.zoom === 'forensic' ? 'center_focus_strong' : 'zoom_in';
  }
 };

 const persistViewState = (patch) => {
  const nextView = {
   ...viewState,
   ...patch,
   layers: { ...viewState.layers, ...((patch && patch.layers) || {}) }
  };
  viewState = nextView;
  if (meridian) meridian.setView(nextView);
  applyViewState(nextView);
 };

 if (meridian) {
  meridian.on('view', (payload) => {
   if (payload && payload.detail) applyViewState(payload.detail);
  });
 }

 applyViewState(viewState);

 if (panelToggle && layerPanel) {
  panelToggle.addEventListener('click', () => layerPanel.classList.toggle('hidden'));
 }

 if (panelClose && layerPanel) {
  panelClose.addEventListener('click', () => layerPanel.classList.add('hidden'));
 }

 if (zoomButton) {
  zoomButton.addEventListener('click', () => {
   const currentIndex = zoomLevels.indexOf(viewState.zoom || 'tactical');
   const nextZoom = zoomLevels[(currentIndex + 1) % zoomLevels.length];
   persistViewState({ zoom: nextZoom });
  });
 }

 if (saveButton) {
  saveButton.addEventListener('click', () => {
   const defaultName = `match-${String(match.id || 'view').slice(-6)}`;
   const name = window.prompt('Save view as', defaultName);
   if (!name) return;
   if (meridian) meridian.saveView(name.trim(), viewState);
  });
 }

 if (layerPanel) {
  layerPanel.querySelectorAll('input[data-layer-toggle]').forEach((input) => {
   input.addEventListener('change', () => {
    const layerName = input.getAttribute('data-layer-toggle');
    persistViewState({ layers: { [layerName]: input.checked } });
   });
  });
 }

 const renderPlayerPanel = (player, team) => {
  if (!player || viewState.layers.drawer === false) {
   playerShell.innerHTML = '';
   playerShell.classList.add('hidden');
   return;
  }

  playerShell.classList.remove('hidden');
  playerShell.innerHTML = '<div class="font-mono text-[10px] uppercase tracking-[0.18em] text-primary">Selected Player</div><div id="selected-player-panel" class="mt-4 space-y-3"></div>';
  const freshPanel = document.getElementById('selected-player-panel');
  if (!freshPanel) return;
  freshPanel.innerHTML = `
   <div class="flex items-center justify-between gap-3">
    <div>
     <div class="font-mono text-[10px] uppercase tracking-[0.18em] text-on-surface-variant">${team.code}</div>
     <div class="mt-1 font-headline text-2xl font-black uppercase tracking-tighter" style="color:${team.color}">${player.name}</div>
    </div>
    <div class="rounded-full border border-outline-variant/30 bg-surface-container-lowest px-3 py-1 text-[10px] uppercase tracking-[0.18em] text-on-surface-variant">#${player.number}</div>
   </div>
   <div class="text-[10px] uppercase tracking-[0.18em] text-on-surface-variant">${player.position}</div>
   <div class="grid grid-cols-2 gap-2">
    ${[['Goals', player.stats.goals], ['Assists', player.stats.assists], ['Passes', player.stats.passes], ['Shots', player.stats.shots], ['Minutes', player.stats.minutes], ['Fouls', player.stats.fouls], ['Cards', player.stats.cards], ['Rating', player.stats.rating]].map(([label, value]) => `<div class="border border-outline-variant/20 bg-surface-container-lowest p-2"><div class="font-mono text-[9px] uppercase tracking-[0.16em] text-on-surface-variant">${label}</div><div class="mt-1 font-headline text-lg font-black ${label === 'Rating' ? 'text-primary' : 'text-on-surface'}">${value}</div></div>`).join('')}
   </div>
  `;
 };

 const renderPitch = () => {
  const selectedId = window.__selectedPlayerId || null;
  const markers = match.hasLineupData
   ? allPlayers().map(({ side, player }) => {
      const team = side === 'home' ? match.homeTeam : match.awayTeam;
      const selected = selectedId === player.id;
      return `
       <button type="button" class="player-overlay ${selected ? 'ring-2 ring-primary ring-offset-2 ring-offset-transparent' : ''}" data-player-id="${player.id}" style="left:${player.x}%; top:${player.y}% ;">
        <div class="player-ring" style="--player-ring-gradient: conic-gradient(${team.color} 0 46%, #5afcd2 46% 74%, #77e6ff 74% 89%, rgba(255,255,255,0.08) 0 100%); box-shadow:${selected ? '0 0 0 6px rgba(105, 246, 184, 0.18)' : 'none'};">
         <span class="player-chip player-chip--top" data-wc26-layer="playerChips"><span class="material-symbols-outlined">schedule</span>${player.stats.minutes}</span>
         <span class="player-chip player-chip--left" data-wc26-layer="playerChips"><span class="material-symbols-outlined">location_on</span>${player.position}</span>
         <span class="player-chip player-chip--right" data-wc26-layer="playerChips">=${player.stats.passes}</span>
         <span class="player-ring__core">${player.number}</span>
         <span class="player-name-pill" data-wc26-layer="playerNames">${player.name}</span>
        </div>
       </button>
      `;
     }).join('')
   : '<div class="absolute inset-0 flex items-center justify-center p-6 text-center text-[10px] font-mono uppercase tracking-[0.2em] text-white/90">Lineup data unavailable</div>';

  pitch.innerHTML = `
  <div class="match-pitch__summary" data-wc26-layer="pitchSummary">
    <span>${match.venue}</span>
    <span>${match.stats.totalGoals} GOALS // ${match.stats.winProbability}% HOME EDGE</span>
   </div>
   <svg class="match-pitch__svg" viewBox="0 0 105 68" preserveAspectRatio="none" aria-hidden="true">
    <rect x="0" y="0" width="105" height="68" fill="#0d5c3c"></rect>
    <rect x="0" y="0" width="105" height="68" fill="rgba(255,255,255,0.04)" opacity="0.55"></rect>
    <rect x="1.25" y="1.25" width="102.5" height="65.5" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="0.7"></rect>
    <line x1="52.5" y1="1.25" x2="52.5" y2="66.75" stroke="rgba(255,255,255,0.7)" stroke-width="0.5"></line>
    <circle cx="52.5" cy="34" r="9.15" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="0.55"></circle>
    <circle cx="52.5" cy="34" r="0.55" fill="rgba(255,255,255,0.9)"></circle>
    <!-- simple goal posts (left and right) -->
    <g class="match-pitch__goals" stroke="rgba(255,255,255,0.9)" fill="none" stroke-width="0.7">
     <!-- left goal (slightly inset from border) -->
     <rect x="0.5" y="30" width="1.5" height="8" />
     <!-- right goal -->
     <rect x="103" y="30" width="1.5" height="8" />
    </g>
   </svg>
   ${markers}
  `;

  pitch.querySelectorAll('button[data-player-id]').forEach((button) => {
   button.addEventListener('click', () => {
    const playerId = button.getAttribute('data-player-id');
    const source = allPlayers().find(({ player }) => player.id === playerId);
    if (!source) return;
    window.__selectedPlayerId = source.player.id;
    renderPlayerPanel(source.player, source.side === 'home' ? match.homeTeam : match.awayTeam);
    renderPitch();
   });
  });
 };

 const init = async () => {
  let appearances = [];

  if (rawMatchId) {
   try {
    const fixture = await fetchWorldCupFixture(rawMatchId);
    if (fixture) applyWorldCupFixture(fixture);
   } catch (error) {
    console.error('Unable to fetch World Cup match details. Falling back to URL data.', error);
   }
  }

  try {
   appearances = await loadWorldCupAppearances();
  } catch (error) {
   console.error('Unable to load player appearances feed.', error);
  }

  if (appearances.length) {
   hydrateWorldCupLineups(appearances);
    applyFormationOverride(match);
  }

  if (!match.hasLineupData) {
    applyFormationOverride(match);
   match.homeLineup = buildLineup(match.homeTeam.name, 'home', match.homeScore, match.awayScore);
   match.awayLineup = buildLineup(match.awayTeam.name, 'away', match.awayScore, match.homeScore);
   match.hasLineupData = true;
   match.lineupSource = 'synthetic';
  }

  rebuildDerivedData();
  applyViewState(viewState);
  setText('match-status-chip', match.status);
  setText('match-stage-chip', match.stage);
  setText('match-date-chip', match.date || 'DATE TBA');
  setText('match-venue-chip', match.venue);
  renderScoreBanner();
  renderPlayerPanel(null, match.homeTeam);
  window.__selectedPlayerId = null;
  renderPitch();
 };

 init();

 function renderScoreBanner() {
  const banner = document.getElementById('match-score-banner');
  if (!banner) return;
  banner.innerHTML = `
   <div class="grid grid-cols-[minmax(3rem,auto)_auto_minmax(3rem,auto)] items-end gap-x-3 leading-none">
    <div class="text-center">
     <div class="font-headline text-4xl font-black tracking-tighter text-[#ff4d4d]">${match.homeScore}</div>
     <div class="mt-1 font-mono text-[10px] uppercase tracking-[0.2em] text-on-surface-variant">${match.homeTeam.name}</div>
    </div>
    <div class="pb-4 font-headline text-3xl font-black tracking-tight text-[#ff4d4d]">:</div>
    <div class="text-center">
     <div class="font-headline text-4xl font-black tracking-tighter text-[#ff4d4d]">${match.awayScore}</div>
     <div class="mt-1 font-mono text-[10px] uppercase tracking-[0.2em] text-on-surface-variant">${match.awayTeam.name}</div>
    </div>
   </div>
  `;
 }

 function setText(id, value) {
  const node = document.getElementById(id);
  if (node) node.textContent = value;
 }

 function configureApiSettings() {
  const currentBase = localStorage.getItem('WC26_API_BASE') || 'https://api.football-data.org/v4';
  const currentToken = localStorage.getItem('WC26_API_TOKEN') || '';
  const currentCompetition = localStorage.getItem('WC26_COMPETITION') || 'WC';
  const currentSeason = localStorage.getItem('WC26_SEASON') || '2026';

  const nextBase = window.prompt('API base URL', currentBase);
  if (nextBase === null) return;
  const nextToken = window.prompt('API token / bearer key', currentToken);
  if (nextToken === null) return;
  const nextCompetition = window.prompt('Competition code', currentCompetition);
  if (nextCompetition === null) return;
  const nextSeason = window.prompt('Season year', currentSeason);
  if (nextSeason === null) return;

  localStorage.setItem('WC26_API_BASE', nextBase.trim() || currentBase);
  localStorage.setItem('WC26_API_TOKEN', nextToken.trim());
  localStorage.setItem('WC26_COMPETITION', nextCompetition.trim() || currentCompetition);
  localStorage.setItem('WC26_SEASON', String(Number(nextSeason) || 2026));
  window.location.reload();
 }

 const settingsButton = document.getElementById('api-settings-button');
 if (settingsButton) settingsButton.addEventListener('click', configureApiSettings);
})();
