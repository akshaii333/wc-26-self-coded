<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=/code%20homepage.html" />
  <title>WC26 Tactical Intel</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e0e0e;
      --panel: #1a1919;
      --line: #494847;
      --text: #ffffff;
      --accent: #69f6b8;
      --muted: #adaaaa;
      --font-headline: "Space Grotesk", system-ui, sans-serif;
      --font-body: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        linear-gradient(rgba(73, 72, 71, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(73, 72, 71, 0.05) 1px, transparent 1px),
        var(--bg);
      background-size: 24px 24px;
      color: var(--text);
      font-family: var(--font-body);
    }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      border: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      padding: 32px;
    }
    h1 {
      margin: 0 0 16px;
      font-family: var(--font-headline);
      font-size: clamp(2.25rem, 4vw, 4rem);
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: -0.05em;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      max-width: 58ch;
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, transparent);
    }
    a:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>WC26 Tactical Intel</h1>
    <p>The deployment landing page redirects into the homepage module. If you land here during a Vercel deploy, the static dashboard pages are being served from the project root and the API proxy is available at <span style="color: var(--accent)">/api</span>.</p>
    <a href="/code%20homepage.html">Enter Simulation</a>
    <div class="hint">Vercel-ready static site</div>
  </main>
</body>
</html>
